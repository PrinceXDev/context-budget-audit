<rect y="20" width="570" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5" fill="#ff5f56"/>
<circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
<circle cx="54" cy="15" r="5" fill="#27c93f"/>
<text x="86" y="19" fill="#8b949e" font-size="11">rote play run princepanchani/gitlab-mr-gate</text>
<text x="18" y="46.0" fill="#79c0ff" xml:space="preserve">GITLAB MR GATE</text>
<text x="18" y="80.0" fill="#c9d1d9" xml:space="preserve">  DEMO RUN - no project or mr was given, so this gated a real public</text>
<text x="18" y="97.0" fill="#c9d1d9" xml:space="preserve">  merge request in gitlab-org/gitlab. Everything below is live data.</text>
<text x="18" y="114.0" fill="#c9d1d9" xml:space="preserve">  Point it at your own:</text>
<text x="18" y="131.0" fill="#c9d1d9" xml:space="preserve">    rote play run princepanchani/gitlab-mr-gate \</text>
<text x="18" y="148.0" fill="#c9d1d9" xml:space="preserve">      project=your-group/your-repo mr=123</text>
<text x="18" y="182.0" fill="#a5d6ff" xml:space="preserve">  https://gitlab.com/gitlab-org/gitlab/-/merge_requests/143468</text>
<text x="18" y="199.0" fill="#c9d1d9" xml:space="preserve">  Remove not-all-data-replicated section</text>
<text x="18" y="233.0" fill="#f85149" xml:space="preserve">VERDICT: BLOCKED</text>
<text x="18" y="267.0" fill="#c9d1d9" xml:space="preserve">  MR !143468 cannot merge: blocking discussions are unresolved. Next move:</text>
<text x="18" y="284.0" fill="#c9d1d9" xml:space="preserve">  mbadeau.</text>
<text x="18" y="318.0" fill="#a5d6ff" xml:space="preserve">  whose move : mbadeau</text>
<text x="18" y="335.0" fill="#a5d6ff" xml:space="preserve">  detail     : 1 blocker(s): discussions</text>
<text x="18" y="369.0" fill="#79c0ff" xml:space="preserve">BLOCKERS (1)</text>
<text x="18" y="386.0" fill="#d29922" xml:space="preserve">  [discussions] Blocking discussions are unresolved.</text>
<text x="18" y="403.0" fill="#a5d6ff" xml:space="preserve">      evidence : blocking_discussions_resolved=false</text>
<text x="18" y="420.0" fill="#a5d6ff" xml:space="preserve">      owner    : mbadeau</text>
<text x="18" y="437.0" fill="#a5d6ff" xml:space="preserve">      next     : Resolve the open threads on the MR.</text>
<text x="18" y="471.0" fill="#c9d1d9" xml:space="preserve">MERGE PATH (what has to happen, in order)</text>
<text x="18" y="488.0" fill="#c9d1d9" xml:space="preserve">  1. Resolve the open threads on the MR.</text>
<text x="18" y="505.0" fill="#a5d6ff" xml:space="preserve">       who : mbadeau</text>
<text x="18" y="522.0" fill="#a5d6ff" xml:space="preserve">       why : Blocking discussions are unresolved.</text>
<text x="18" y="556.0" fill="#c9d1d9" xml:space="preserve">  Order matters: branch work first, because a later push commonly</text>
<text x="18" y="573.0" fill="#c9d1d9" xml:space="preserve">  resets approvals gathered before it.</text>
<text x="18" y="607.0" fill="#79c0ff" xml:space="preserve">NOT MEASURED (0)</text>
<text x="18" y="624.0" fill="#c9d1d9" xml:space="preserve">  nothing - every dimension was read</text>
<text x="18" y="658.0" fill="#79c0ff" xml:space="preserve">STAGE LEDGER</text>
<text x="18" y="675.0" fill="#8b949e" xml:space="preserve">  read      merge_request</text>
<text x="18" y="692.0" fill="#8b949e" xml:space="preserve">  read      approvals</text>
<text x="18" y="709.0" fill="#8b949e" xml:space="preserve">  read      approval_rules</text>
<text x="18" y="726.0" fill="#8b949e" xml:space="preserve">  read      pipeline</text>
<text x="18" y="743.0" fill="#8b949e" xml:space="preserve">  read      discussions</text>
<text x="18" y="760.0" fill="#c9d1d9" xml:space="preserve">      (via the MR blocking_discussions_resolved flag, readable</text>
<text x="18" y="777.0" fill="#c9d1d9" xml:space="preserve">      without a token)</text>
<text x="18" y="811.0" fill="#c9d1d9" xml:space="preserve">  ... 23 more lines in the full report</text>
</svg>